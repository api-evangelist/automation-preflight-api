description: >-
  The Automation Preflight API has no persistent resources — there is no
  customer, account, or object graph to model. It is a single-shot evaluation
  service: one URL in, one bounded evidence document out. What follows is the
  structure of that evidence document, which is the API's real data model.
persistence: none
entities:
