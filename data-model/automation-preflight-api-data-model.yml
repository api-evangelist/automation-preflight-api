    root: true
    description: The complete response document for one analysis.
    fields:
      - {name: ok, type: boolean, description: Success discriminator.}
      - {name: service, type: string, description: Service name constant.}
      - {name: version, type: string, description: Service build version (1.1.0 observed).}
      - {name: analyzed_at, type: string, format: date-time, description: UTC timestamp of the analysis.}
    relationships:
      - {has_one: Target, via: target}
      - {has_one: RobotsAssessment, via: robots}
      - {has_one: PageSummary, via: page}
      - {has_many: Form, via: forms}
      - {has_many: IntegrationLink, via: integration_links}
      - {has_one: SecurityHeaders, via: security_headers}
      - {has_one: Readiness, via: readiness}
      - {has_many: string, via: structured_data_types, description: Detected schema.org / structured-data type names.}
  - name: Target
    description: What was actually fetched, after redirects.
    fields:
