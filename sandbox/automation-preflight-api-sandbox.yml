    url: https://preflight.tinyopsstudio.com/analyze
    method: POST
    auth: none
    verified:
      status: 200
      date: '2026-08-09'
    note: >-
      Returns the full evidence document with no key. This is the de-facto
      sandbox: the response contract is identical to the metered
      /direct/analyze endpoint, so a developer can integrate and test against it
      before purchasing. Bounded by the unpublished service rate limit (429).
    caution: >-
