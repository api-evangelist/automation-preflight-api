base_url: https://preflight.tinyopsstudio.com
base_url_mirror: https://tinyops-automation-preflight.ancient-field-1495.workers.dev
api_style: REST over HTTPS, JSON request body, JSON response. No JavaScript execution, no raw HTML returned.

access_tiers:
  - tier: open
    path: POST /analyze
    auth: none
    verified: '2026-08-09'
    note: >-
      Verified returning HTTP 200 anonymously. Subject to an unpublished service
      rate limit (429).
  - tier: direct
    path: POST /direct/analyze
    auth: X-TinyOps-API-Key
    note: >-
      Metered access. A call consumes quota only after a successful analysis.
  - tier: acceptance-pack
    path: POST /acceptance-pack
    auth: none on the published contract; sold per-run via AgenticTrade
    note: Returns preflight evidence plus launch gates, acceptance tests, and a remediation backlog.

authentication:
  scheme: API key in a request header
  header: X-TinyOps-API-Key
  key_source: >-
    The Gumroad license key shown in the purchase receipt and download page, or a
    key issued directly by TinyOps Studio.
  docs: https://tinyopsstudio.com/automation-preflight-api
  detail: authentication/automation-preflight-api-authentication.yml

idempotency:
  supported: false
  reason: >-
    No idempotency key header or parameter is documented or present in either
    OpenAPI contract. The analyze operations are POST but are read-only with
    respect to the caller's own state — they fetch and score a third-party public
    URL and create no server-side resource — so a repeated call is naturally
    safe to retry, but there is no replay/deduplication contract and no
    Idempotency-Key mechanism. Recorded as absent rather than inferred.

pagination:
  supported: false
  reason: Single-object responses only; there are no collection endpoints.

response_envelope:
