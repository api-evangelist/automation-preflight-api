boundaries:
  description: >-
    Constraints the service enforces on every request. These are contractual, not
    advisory — the documentation states them as deliberate boundaries.
  rules:
    - Rejects private and credential-bearing target URLs (400).
    - Honors robots exclusions on the target (403).
    - Bounds the redirect chain and the response size (413).
    - Accepts HTML targets only (415).
    - Does not execute JavaScript.
    - Does not return raw HTML or submitted form values.
    - Never attempts login or CAPTCHA bypass.
    - Target URL is capped at 2048 characters.
  disclaimer: >-
    Results reflect the public server-rendered page observed at request time and
    do not prove that a third-party integration works. Not a security
    certification.

