apis:
  - name: Automation Preflight API
    description: >-
      REST API that returns bounded integration-preflight evidence for a supplied public URL. Three operations:
      POST /analyze (open, no key, verified answering anonymously), POST /direct/analyze (metered, authenticated with
      the X-TinyOps-API-Key header carrying a Gumroad license key), and POST /acceptance-pack (returns preflight
      evidence plus launch gates, acceptance tests, and a remediation backlog). GET /health is unauthenticated.
      Responses cover reachability, robots policy, page structure, forms, integration links, security headers, and a
      deterministic readiness score and grade.
    humanURL: https://tinyopsstudio.com/automation-preflight-api
