name: Automation Preflight API

description: >-
  A self-serve REST API by TinyOps Studio LLC that inspects a public URL and returns deterministic, bounded JSON
  integration-readiness evidence across reachability, integration surface, and readiness scoring. It rejects
  private/credential-bearing targets, honors robots exclusions, bounds redirects and response sizes, does not execute
  JavaScript, and does not return raw HTML. Three operations are published: an open POST /analyze that answers
  without a key, a metered POST /direct/analyze authenticated with a Gumroad license key, and POST /acceptance-pack
  which returns launch gates, acceptance tests, and a prioritized remediation backlog. Sold as a $19 pack of 500
  analyses, as pay-as-you-go units on API.market, per-run on AgenticTrade, and as a separately licensed source
  bundle (the Cloudflare Workers implementation, a $2,500 one-time non-exclusive license for one organization).

